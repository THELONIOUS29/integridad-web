<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntegridadWeb | Registro</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="/">IntegridadWeb</a>
      <div class="nav-links">
        <a href="/register.html" aria-current="page">Registro</a>
        <a href="/login.html">Login</a>
        <a href="/comments.html">Comentarios</a>
      </div>
    </nav>
  </header>

  <main class="main form-layout">
    <section class="form-card">
      <p class="eyebrow">Cuenta segura</p>
      <h1>Registro de usuario</h1>
      <form id="registerForm" novalidate>
        <label for="nombre">Nombre</label>
        <input id="nombre" name="nombre" type="text" maxlength="50" autocomplete="name" required>

        <label for="correo">Correo</label>
        <input id="correo" name="correo" type="email" maxlength="120" autocomplete="email" required>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>

        <button class="btn btn-primary full-width" type="submit">Registrarme</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
      <p class="form-footer">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
    </section>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
